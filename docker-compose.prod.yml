services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      DEV: 'False'
      UVICORN_HOST: '0.0.0.0'
      CACHE_HOST: 'cache'
    env_file:
      - .env.prod
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  cache:
    restart: always
