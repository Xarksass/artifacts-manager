[project]
name = "Artifacts Manager"
version = "0.1.0"
description = "Character manager for Artifacts MMO"
readme = "README.md"
authors = [
    { name = "Xarksass", email = "disalvo.infographiste@gmail.com" }
]
license = "CC BY-NC-SA 4.0"
license-files = [
    "LICENSE"
]
requires-python = ">=3.14"
dependencies = [
    "asyncio>=4.0.0",
    "dotenv>=0.9.9",
    "requests>=2.34.2",
]

[project.scripts]
artifactsmmo = "artifactsmmo:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
